path: medlog.csv.gz

columns:
  - name: <Patient ID Column>
    type: string
  - name: <Event Start Column>
    type: datetime
    params:
      format: "%Y-%m-%d %H:%M:%S"
  - name: <Item ID Column>
    type: int64
  - name: <Amount Column>
    type: float32
  - name: <Unit Column>
    type: string
  - name: <Text Value Column>
    type: string

join:
  - name: staylog
    path: staylog.csv.gz
    columns:
      - name: <Patient ID Column>
        type: string
      - name: <Stay ID Column>
        type: string 
      - name: <ICU Admission Column>
        type: datetime
        params:
          format: "%Y-%m-%d %H:%M:%S"
      - name: <ICU Discharge Column>
        type: datetime
        params:
          format: "%Y-%m-%d %H:%M:%S"
    both_on:
      - <Patient ID Column>
    callbacks:
      - dense_rank_encode(<Stay ID Column>, output=subject_id)

  - name: items
    path: items.csv.gz
    columns:
      - name: <Item ID Column>
        type: int64
      - name: <Item Name Column>
        type: string
    both_on:
      - <Item ID Column>
      
event_defaults:
  subject_id: col(subject_id)
  extension:
    stay_id: col(<Stay ID Column>)
    patientid: col(<Patient ID Column>)

events:
  - name: INFUSION_START
    columns:
      time: col(<Event Start Column>)
      code:
        - col(<Item ID Column>)
        - col(<Item Name Column>)
        - col(<Text Value Column>)
        - col(<Unit Column>)
      numeric_value: col(<Amount Column>)
      text_value: col(<Text Value Column>)
    filters: 
      - greater_equal(<Event Start Column>, <ICU Admission Column>) & less_equal(<Event Start Column>, <ICU Discharge Column>)
      
