type: simple
mappings:
  - pattern:
      table: medications
      event: INFUSION_START
      code: (<Dobutamine Item ID>(//.*)?)<Milligram Unit>$ 
    columns:
      numeric_value: col(numeric_value) / 1000
      text_value: col(text_value)
  - pattern:
      table: medications
      event: INFUSION_START
      code: (<Dobutamine Item ID>(//.*)?)<Microgram Unit>$
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)