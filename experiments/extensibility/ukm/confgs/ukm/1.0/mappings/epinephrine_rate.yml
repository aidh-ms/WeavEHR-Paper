type: simple
mappings:
  - pattern:
      table: medications
      event: INFUSION_START
      code: (^<Epinephrine Item ID 1>(//.*)?|^<Epinephrine Item ID 2>(//.*)?)<Milligram Unit>$
    columns: 
      numeric_value: col(numeric_value)/1000
      text_value: col(text_value)
  - pattern:
      table: medications
      event: INFUSION_START
      code: (^<Epinephrine Item ID 1>(//.*)?|^<Epinephrine Item ID 2>(//.*)?)<Microgram Unit>$
    columns: 
      numeric_value: col(numeric_value)
      text_value: col(text_value)
