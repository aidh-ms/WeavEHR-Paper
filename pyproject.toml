[project]
name = "weavehr_paper"  # TODO
description = "Template for python project"  # TODO
version = "0.0.1"
license = "MIT"  # TODO
authors = [
    { name = "Paul-B98", email = "115164840+Paul-B98@users.noreply.github.com" }  # TODO
]
maintainers = [
    { name = "Paul-B98", email = "115164840+Paul-B98@users.noreply.github.com" }  # TODO
]
readme = "README.md"
keywords = ["Python Lib"]  # TODO
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.14"
dependencies = [
    "weavehr>=0.0.1",
]

[project.urls]
homepage = "https://github.com/aidh-ms/WeavEHR-Paper"  # TODO
repository = "https://github.com/aidh-ms/WeavEHR-Paper"  # TODO
changelog = "https://github.com/aidh-ms/WeavEHR-Paper/releases"  # TODO
issues = "https://github.com/aidh-ms/WeavEHR-Paper/issues"  # TODO
documentation = "https://github.com/aidh-ms/WeavEHR-Paper/wiki"  # TODO

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-github-actions-annotate-failures>=0.4.2",
    "pytest-random-order>=1.2.0",
    "pytest-recording>=0.13.4",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]

[tool.uv]
exclude-newer = "P7D"
exclude-newer-package = { weavehr = false }

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
filterwarnings = ["ignore::DeprecationWarning"]
pythonpath = ["src"]
cache_dir = "/workspaces/.cache/pytest"
addopts = [
    "--cov",
    "--cov-branch",
    "--cov=src",
    "--cov-report=xml",
    "--import-mode=importlib",
]
