services:
  weavehr_paper:
    container_name: weavehr_paper
    extra_hosts:
      - host.docker.internal:host-gateway
    init: true
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    env_file:
      - .env
      - path: local.env
        required: false
    volumes:
      - ..:/workspaces:cached
      - ${DATA_FOLDER}:/workspaces/data/ehr
    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity
